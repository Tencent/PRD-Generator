<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{页面名称} - {产品名称} 原型</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <!-- 骨架：PC / 后台页面（1440px）。侧栏 + 顶栏 + 内容区。
       颜色一律用 var(--color-…)；状态用 ?s=xxx 切换，弹窗用 data-open / ?open=#id 触发，保证 prdkit shot 能到达。 -->
  <div class="desktop-frame">
    <aside class="sidebar">
      <div class="sidebar__logo">{产品名称}</div>
      <div class="sidebar__group">{分组名}</div>
      <a class="sidebar__item active" href="{页面A}.html">{菜单 A}</a>
      <a class="sidebar__item" href="{页面B}.html">{菜单 B}</a>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="breadcrumb">{一级菜单} / <b>{当前页}</b></div>
        <div class="text-secondary text-sm">{管理员昵称}</div>
      </header>

      <div class="page-body">
        <div class="page-title">{页面标题}</div>

        <div class="panel">
          <div class="filter-bar">
            <input class="input" placeholder="{搜索提示}">
            <span class="select">{筛选项} <span>▾</span></span>
            <div class="btn btn--primary btn--sm">查询</div>
            <div class="btn btn--secondary btn--sm">重置</div>
          </div>

          <table class="table" data-state-not="empty">
            <thead><tr><th>{列 1}</th><th>{列 2}</th><th class="num">{数值列}</th><th>操作</th></tr></thead>
            <tbody>
              <tr><td>{真实数据}</td><td><span class="tag tag--success">{状态}</span></td><td class="num">{数字}</td>
                  <td><span class="btn btn--link" data-open="#dlg">{操作}</span></td></tr>
            </tbody>
          </table>
          <div class="table-empty" data-state="empty">{空态说明}</div>

          <div class="pagination" data-state-not="empty">
            <span>共 {N} 条</span><span class="pagination__item">‹</span><span class="pagination__item active">1</span><span class="pagination__item">2</span><span class="pagination__item">›</span>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay center" id="dlg">
      <div class="dialog">
        <div class="dialog__title">{对话框标题}</div>
        <div class="dialog__body">{说明，写清影响范围}</div>
        <div class="dialog__footer">
          <div class="btn btn--secondary btn--sm" data-close>取消</div>
          <div class="btn btn--primary btn--sm" data-close data-toast="{操作成功提示}">确认</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/interaction.js"></script>
</body>
</html>
